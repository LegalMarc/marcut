name: macOS Build + Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-verify:
    runs-on: [self-hosted, marcut-local]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Self-hosted runner: use its own pre-installed python3.11 rather than
      # actions/setup-python, which isn't cached here and is slow/unreliable to
      # provision on demand. python@3.11 is a keg-only Homebrew formula (no
      # unversioned `python3`/`pip`/`pytest` in its bin dir), so a bare PATH
      # prepend wouldn't make later steps' plain `python3` calls
      # (release_preflight.sh, create_python_bundle.sh) resolve to it -- create
      # a venv instead, which does provide those generic names, and put its
      # bin dir on PATH for the rest of the job.
      - name: Set up Python 3.11
        run: |
          python3.11 -m venv .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Install Python deps + tests
        run: |
          python3 -m pip install -U pip
          pip install -e ".[dev]"
          python3 scripts/check_dependency_vulnerabilities.py requirements-pinned.txt
          python3 scripts/generate_python_sbom.py --check
          python3 scripts/check_markdown_links.py
          pytest -q

      - name: Prepare stub Ollama for packaging
        run: |
          cat > ollama_binary <<'SH'
          #!/usr/bin/env bash
          echo "ollama stub: $@" >&2
          exit 0
          SH
          chmod +x ollama_binary

      - name: Build embedded python bundle
        run: |
          chmod +x create_python_bundle.sh
          ./create_python_bundle.sh

      - name: Swift unit tests
        run: swift test --package-path src/swift/MarcutApp

      - name: Release preflight gate
        run: bash scripts/release_preflight.sh

      - name: Build Debug DMG (Swift-only)
        run: |
          chmod +x scripts/sh/build_swift_only.sh
          ./scripts/sh/build_swift_only.sh

      - name: Verify DMG (artifact checks + embedded spawn + mock redaction)
        run: |
          chmod +x scripts/verify_bundle.sh || true
          if [ -f scripts/verify_bundle.sh ]; then
            bash scripts/verify_bundle.sh MarcutApp-Swift-*.dmg
          else
            echo "scripts/verify_bundle.sh not present in repo; please add it from upload/scripts/"
            exit 1
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-dmg
          path: MarcutApp-Swift-*.dmg
          retention-days: 7
